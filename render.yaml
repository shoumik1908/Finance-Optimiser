services:
  - type: web
    name: finance-optimiser
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PORT
        value: 8501
      - key: GROQ_API_KEY
        sync: false
